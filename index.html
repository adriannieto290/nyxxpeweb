<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda DJ Nyxxpe</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
    }
    header {
      background-color: #1f1f1f;
      padding: 20px;
      text-align: center;
      position: relative;
    }
    h1 {
      margin: 0;
    }
    .logo {
      position: absolute;
      top: 20px;
      right: 30px;
      width: 100px;
      height: auto;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .product {
      background-color: #222;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }
    .product img {
      width: 100%;
      max-width: 200px;
      height: auto;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .product h3 {
      margin: 10px 0 5px;
      font-size: 1.1em;
    }
    .product p {
      margin: 5px 0;
      font-size: 1em;
    }
    .btn {
      background-color: #ff2e63;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
      margin-top: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Logo DJ Nyxxpe" class="logo">
    <h1>Tienda Oficial - DJ Nyxxpe</h1>
    <p>Merch y contenido exclusivo</p>
  </header>

  <div class="container">
    <div class="product">
      <img src="images/producto1.jpg.jpg" alt="Producto 1">
      <h3>Taza con logo</h3>
      <p>10€</p>
      <a href="#" class="btn">Comprar</a>
    </div>
    <div class="product">
      <img src="images/producto2.jpg.jpg" alt="Producto 2">
      <h3>Lanyard</h3>
      <p>7€</p>
      <a href="#" class="btn">Comprar</a>
    </div>
    <div class="product">
      <img src="images/producto3.jpg.jpg" alt="Producto 3">
      <h3>Usb</h3>
      <p>5€</p>
      <a href="#" class="btn">Comprar</a>
    </div>
    <div class="product">
      <img src="images/producto4.jpg.jpg" alt="Producto 4">
      <h3>Cantimplora resistente</h3>
      <p>15€</p>
      <a href="#" class="btn">Comprar</a>
    </div>
    <div class="product">
        <img src="images/producto5.jpg.jpg" alt="Producto 4">
        <h3>Sudadera</h3>
        <p>25€</p>
        <a href="#" class="btn">Comprar</a>
      </div>
  </div>
</body>
</html>
